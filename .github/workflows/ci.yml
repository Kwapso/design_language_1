name: check

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: npm install

      # The generated outputs must match tokens.json exactly. If a build
      # produces a diff, someone edited dist/ by hand — which silently breaks
      # the single-source-of-truth guarantee the whole system rests on.
      - name: Tokens are in sync with tokens.json
        run: |
          npm run build
          git diff --exit-code -- dist docs/assets || {
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          }

      - name: WCAG contrast
        run: npm run check:contrast

      - name: Cognitive-load budgets
        run: npm run check:cognitive

      - name: Types
        run: npx tsc --noEmit

  pages:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
