<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components — Structure</title>
<meta name="description" content="Every component in the Kwapso design language, rendered live.">
<link rel="stylesheet" href="./assets/fonts.css">
<link rel="stylesheet" href="./assets/structure.css">
<!-- structure-ignore accent-budget: a specimen sheet renders every accent variant on purpose. -->
<!-- structure-ignore type-scale: a gallery necessarily shows the whole scale. -->
<style>
  .wide { width: min(1400px, 100% - 80px); margin-inline: auto; }
  @media (max-width: 700px) { .wide { width: calc(100% - 40px); } }
  .spec { font-family: var(--st-font-mono); font-size: var(--st-text-xs); color: var(--st-muted); }
  .kicker { font-family: var(--st-font-display); font-weight: 300; font-size: clamp(2rem, 5vw, 3.4rem); line-height: .95; }
  .demo { padding: var(--st-space-m); border: 1px solid var(--st-border); border-radius: var(--st-radius-surface); background: var(--st-background); }
  .lay { display: grid; grid-template-columns: 210px 1fr; gap: var(--st-space-l); align-items: start; }
  /* A grid child defaults to min-content width, so one wide demo (the kanban)
     would force the whole column open and scroll the page sideways. This is
     the exact failure screens.css warns about for the app shell. */
  .lay > * { min-width: 0; }
  @media (max-width: 960px) { .lay { grid-template-columns: 1fr; } .rail { position: static !important; } }
  .rail { position: sticky; top: 72px; max-height: 82svh; overflow-y: auto; }
  .item { scroll-margin-top: 80px; }
  .item + .item { margin-top: var(--st-space-l); }
  .phone { width: 280px; border: 1px solid var(--st-border-control); border-radius: 26px; overflow: hidden; }
  .phone__notch { height: 24px; display: grid; place-items: center; background: var(--st-surface); }
  .phone__pill { width: 64px; height: 5px; border-radius: 3px; background: var(--st-border-control); }
</style>
</head>
<body>
<a href="#main" class="st-skip-link">Skip to content</a>

<header class="st-navbar" style="position:sticky;top:0;z-index:100">
  <strong style="letter-spacing:var(--st-tracking-wide)"><a href="./" style="text-decoration:none">Structure</a></strong>
  <nav class="st-navbar__links" aria-label="Main">
    <a class="st-navbar__link" href="./">Overview</a>
    <a class="st-navbar__link" href="./components.html" aria-current="page">Components</a>
    <a class="st-navbar__link" href="./screens.html">Screens</a>
    <a class="st-navbar__link" href="./loaders.html">Loaders &amp; states</a>
  </nav>
  <div class="st-cluster">
    <div class="st-segmented" role="group" aria-label="Density">
      <button class="st-segmented__item" aria-pressed="true" data-density="comfortable">Comfortable</button>
      <button class="st-segmented__item" aria-pressed="false" data-density="compact">Compact</button>
    </div>
    <button class="st-btn st-btn--ghost st-btn--sm" id="theme" aria-label="Switch theme">Theme</button>
  </div>
</header>

<main id="main" class="wide" style="padding-block:var(--st-space-xl)">
  <p class="st-eyebrow">Components</p>
  <h1 class="kicker" style="margin-top:var(--st-space-s);max-width:22ch">Every part, rendered live.</h1>
  <p class="st-lead" style="margin-top:var(--st-space-base)">
    Nothing here is a screenshot. <strong id="count">—</strong> registry entries, each proven by
    <code>npm run check:coverage</code> to resolve to a real class and a real React export.
  </p>

  <div class="lay" style="margin-top:var(--st-space-xl)">
    <nav class="st-sidebar rail" aria-label="Components"><div id="toc"></div></nav>
    <div id="gallery"></div>
  </div>
</main>

<footer class="wide" style="padding-block:var(--st-space-m)">
  <hr class="st-divider">
  <p class="st-caption" style="margin-top:var(--st-space-base)">Structure — the Kwapso design language.</p>
</footer>

document.getElementById("count").textContent = reg.items.length

/* Registry entries that share an implementation with another entry get one
   canonical demo rather than a duplicate; the alias is listed on that card. */
const aliasOf = {
  "icon-button":"button", separator:"divider", collapsible:"accordion", sheet:"drawer",
  "context-menu":"dropdown-menu", "hover-card":"popover", "data-table":"table",
  "card-grid":"grid", "activity-feed":"timeline", "stat-grid":"stat", "ticket-thread":"comments",
  "article-body":"prose", tag:"badge", "date-picker":"calendar", "date-range":"calendar",
  "calendar-view":"calendar", "range-slider":"slider", nps:"scale", "avatar-group":"avatar",
  "button-group":"button", "section-header":"hero", "feature-row":"split", "pricing-screen":"pricing-table",
  "import-wizard":"wizard-screen", sparkline:"chart", heatmap:"chart", "time-picker":"calendar",
  "color-input":"input", "detail-view":"split", label:"field", "message-list":"chat", message:"chat",
  composer:"chat", "tool-call":"chat", reasoning:"chat", citation:"chat", "suggested-prompts":"chat",
  "copilot-overlay":"chat", clamp:"prose", text:"prose", heading:"prose", "sr-only":"skip-link",
  box:"stack", center:"grid", spacer:"cluster", visibility:"grid", portal:"dialog", icon:"badge",
}

/* Screens, loaders and states live on their own pages. */
const elsewhere = { screen: "./screens.html", loader: "./loaders.html", state: "./loaders.html" }

const shown = reg.items.filter((i) => !elsewhere[i.layer])
const groups = {}
for (const it of shown) (groups[it.layer] ??= []).push(it)

const label = { primitive: "Primitives", composite: "Composites", collection: "Collections", pattern: "Patterns" }
let toc = "", html = ""

for (const [layer, items] of Object.entries(groups)) {
  toc += `<p class="st-eyebrow" style="padding:var(--st-space-s) var(--st-space-s) 4px">${label[layer] ?? layer}</p>`
  html += `<h2 class="st-display st-display--xs item" id="l-${layer}" style="margin-top:var(--st-space-xl)">${label[layer] ?? layer}</h2>`

  for (const it of items) {
    const key = demos[it.name] ? it.name : aliasOf[it.name]
    toc += `<a class="st-sidebar__link" href="#c-${it.name}">${it.name}</a>`
    html += `<section class="item" id="c-${it.name}">
      <div class="st-cluster st-cluster--between" style="margin-bottom:var(--st-space-s)">
        <h3 style="font-size:var(--st-text-md)">${it.name}</h3>
        <span class="spec">${it.css ? "." + it.css : "—"} · &lt;${it.react ?? "—"}&gt;</span>
      </div>
      ${key && demos[key]
        ? `<div class="demo">${demos[key]}</div>${key !== it.name ? `<p class="spec" style="margin-top:4px">Shares its implementation with <a href="#c-${key}">${key}</a>.</p>` : ""}`
        : `<div class="demo st-caption">Rendered on the <a href="${elsewhere[it.layer] ?? "./screens.html"}">screens page</a>.</div>`}
    </section>`
  }
}
document.getElementById("toc").innerHTML = toc
document.getElementById("gallery").innerHTML = html

/* ---- August 2026 calendar for the date demos ---- */
const cal = document.getElementById("cal")
if (cal) {
  const dow = ["Mo","Tu","We","Th","Fr","Sa","Su"]
  const lead = (new Date(2026, 7, 1).getDay() + 6) % 7
  cal.innerHTML = dow.map(d => `<div class="st-calendar__dow">${d}</div>`).join("")
    + Array.from({length:lead},()=>"<div></div>").join("")
    + Array.from({length:31},(_,i)=>`<button class="st-calendar__day"${i+1===18?' data-today="true"':''}${i+1===21?' aria-selected="true"':''}>${i+1}</button>`).join("")
}

/* ---- shared page behaviour ---- */
const order = ["light","dark","system"]; let ti = 0
document.getElementById("theme").onclick = (e) => {
  ti = (ti + 1) % 3; const t = order[ti]
  if (t === "system") document.documentElement.removeAttribute("data-theme")
  else document.documentElement.setAttribute("data-theme", t)
  e.currentTarget.textContent = t
}
document.querySelectorAll("button[data-density]").forEach(b => b.onclick = () => {
  document.documentElement.setAttribute("data-density", b.dataset.density)
  document.querySelectorAll("button[data-density]").forEach(o => o.setAttribute("aria-pressed", String(o === b)))
})

/* Interactive demos, so the gallery behaves like the real components. */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button")
  if (!t) return
  if (t.classList.contains("st-scale__item") || t.classList.contains("st-segmented__item")
      || t.getAttribute("role") === "tab" || t.classList.contains("st-toggle")
      || t.classList.contains("st-carousel__dot")) {
    const group = t.parentElement
    const attr = t.hasAttribute("aria-selected") ? "aria-selected"
      : t.hasAttribute("aria-current") || t.classList.contains("st-carousel__dot") ? "aria-current" : "aria-pressed"
    group.querySelectorAll("button").forEach(o => {
      o.setAttribute(attr, String(o === t)); o.removeAttribute("data-selected")
    })
    if (t.classList.contains("st-scale__item")) t.setAttribute("data-selected", "true")
  }
  if (t.classList.contains("st-rating__star")) {
    const stars = [...t.parentElement.children]
    stars.forEach((s, i) => s.toggleAttribute("data-on", i <= stars.indexOf(t)))
  }
  if (t.classList.contains("st-chip__remove")) t.parentElement.remove()
  if (t.classList.contains("st-toolcall__head")) {
    const open = t.getAttribute("aria-expanded") === "true"
    t.setAttribute("aria-expanded", String(!open))
    t.querySelector("span:last-child").textContent = open ? "+" : "−"
  }
})
document.querySelectorAll(".st-choice input").forEach(i => i.onchange = () => {
  document.querySelectorAll(`.st-choice:has(input[name="${i.name}"])`).forEach(c => c.removeAttribute("data-selected"))
  i.closest(".st-choice").setAttribute("data-selected", "true")
})
const indet = document.getElementById("indet"); if (indet) indet.indeterminate = true

/* Overlays are opened for real, so focus behaviour is visible. */
const overlay = (html) => {
  const w = document.createElement("div")
  w.innerHTML = `<div class="st-overlay"></div>${html}`
  document.body.append(w)
  const close = () => w.remove()
  w.querySelector(".st-overlay").onclick = close
  w.querySelectorAll("[data-close]").forEach(b => b.onclick = close)
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc) }
  })
}
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-open-modal]")) overlay(`<div class="st-modal" role="dialog" aria-modal="true" aria-label="Rename process"><h2 class="st-modal__title">Rename process</h2><div class="st-field"><label class="st-field__label" for="mn">Name</label><input class="st-input" id="mn" value="Quote to order"></div><div class="st-modal__actions"><button class="st-btn st-btn--ghost" data-close>Cancel</button><button class="st-btn st-btn--accent" data-close>Save</button></div></div>`)
  if (e.target.closest("[data-open-confirm]")) overlay(`<div class="st-modal" role="alertdialog" aria-modal="true" aria-label="Delete process"><h2 class="st-modal__title">Delete this process?</h2><p>Its history and attachments go with it. This cannot be undone.</p><div class="st-modal__actions"><button class="st-btn st-btn--ghost" data-close>Cancel</button><button class="st-btn st-btn--danger" data-close>Delete</button></div></div>`)
  if (e.target.closest("[data-open-drawer]")) overlay(`<aside class="st-drawer" role="dialog" aria-modal="true" aria-label="Process details"><div class="st-cluster st-cluster--between"><h2 class="st-card__title">Quote to order</h2><button class="st-btn st-btn--ghost st-btn--sm st-btn--icon" data-close aria-label="Close">×</button></div><dl class="st-kv" style="margin-top:var(--st-space-base)"><dt>Owner</dt><dd>Sales</dd><dt>Hours / week</dt><dd>21.25</dd><dt>Automatable</dt><dd>82%</dd></dl></aside>`)
})
</script>
